<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
  <title id="title">Ramandeep Singh — backend depth, full-stack range.</title>
  <desc id="desc">A midnight engineering lab with mint and violet orbital paths, a moving signal, and a terminal. Java backend developer, AI builder, full-stack engineer.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090f1c"/><stop offset="1" stop-color="#101426"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#8fffd2"/><stop offset="1" stop-color="#bba4ff"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#7560c9" stop-opacity=".22"/><stop offset="1" stop-color="#7560c9" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8698c0" stroke-opacity=".06"/></pattern>
    <path id="orbit" d="M 828,218 a 142,142 0 1,0 284,0 a 142,142 0 1,0 -284,0"/>
  </defs>
  <rect width="1280" height="600" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="598" rx="23" fill="url(#grid)" stroke="#263044"/>
  <circle cx="970" cy="215" r="290" fill="url(#halo)"/>
  <g font-family="'Courier New',monospace">
    <rect x="56" y="41" width="42" height="34" rx="9" fill="#8fffd2"/>
    <text x="77" y="64" text-anchor="middle" font-size="17" font-weight="700" fill="#09151b">RS</text>
    <text x="113" y="64" font-size="15" letter-spacing="2" fill="#b9c5d9">RAMAN-EXE404 / ENGINEERING</text>
    <circle cx="1054" cy="58" r="4" fill="#8fffd2"><animate attributeName="opacity" values="1;.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <text x="1069" y="64" font-size="13" letter-spacing="1" fill="#b9c5d9">BUILD. ITERATE.</text>
    <text x="62" y="121" font-size="13" letter-spacing="4" fill="#8fffd2">HELLO, WORLD. I'M</text>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="-4" fill="#f0f4ff">
    <text x="56" y="216" font-size="92">Ramandeep</text>
    <text x="56" y="310" font-size="92" fill="url(#accent)">Singh.</text>
  </g>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="62" y="363" font-size="26" fill="#e1e7f5">Backend depth. Full-stack range.</text>
    <text x="62" y="398" font-size="19" fill="#9baac3">Turning complex problems into thoughtful software.</text>
  </g>
  <g fill="none" stroke="#bba4ff">
    <circle cx="970" cy="218" r="142" stroke-opacity=".25"/>
    <circle cx="970" cy="218" r="112" stroke-opacity=".15" stroke-dasharray="4 10"/>
    <ellipse cx="970" cy="218" rx="185" ry="66" transform="rotate(-32 970 218)" stroke-opacity=".45"/>
    <ellipse cx="970" cy="218" rx="185" ry="66" transform="rotate(32 970 218)" stroke="#8fffd2" stroke-opacity=".3"/>
  </g>
  <circle cx="970" cy="218" r="76" fill="#101a2b" stroke="#8fffd2" stroke-opacity=".6"/>
  <circle cx="970" cy="218" r="65" fill="none" stroke="#8fffd2" stroke-opacity=".12"/>
  <text x="970" y="232" text-anchor="middle" font-family="'Courier New',monospace" font-size="44" font-weight="700" fill="#8fffd2">&lt;/&gt;</text>
  <circle cx="828" cy="218" r="6" fill="#8fffd2"><animateMotion dur="18s" repeatCount="indefinite" path="M0 0 a142 142 0 1 0 284 0 a142 142 0 1 0 -284 0"/></circle>
  <circle cx="1112" cy="218" r="4" fill="#bba4ff"><animateMotion dur="24s" repeatCount="indefinite" path="M0 0 a142 142 0 1 0 -284 0 a142 142 0 1 0 284 0"/></circle>
  <g font-family="'Courier New',monospace">
    <rect x="800" y="387" width="380" height="79" rx="10" fill="#0a111f" stroke="#2b374e"/>
    <text x="819" y="416" font-size="14" fill="#96a9c7">~/raman <tspan fill="#8fffd2">$</tspan> ./build-something-real</text>
    <text x="819" y="443" font-size="14" fill="#bba4ff">&gt; ideas.into(impact);</text>
    <rect x="1009" y="431" width="8" height="15" fill="#8fffd2"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.49;.5;1" dur="1.2s" repeatCount="indefinite"/></rect>
  </g>
  <path d="M62 501H1218" stroke="#283247"/>
  <g font-family="'Courier New',monospace" font-size="14" letter-spacing="1">
    <text x="62" y="542" fill="#8fffd2">01 <tspan fill="#cad4e7">JAVA &amp; SPRING BOOT</tspan></text>
    <text x="485" y="542" fill="#bba4ff">02 <tspan fill="#cad4e7">APPLIED AI</tspan></text>
    <text x="887" y="542" fill="#8fffd2">03 <tspan fill="#cad4e7">FULL-STACK SYSTEMS</tspan></text>
  </g>
  <rect x="62" y="574" width="1156" height="2" fill="#263247"/>
  <rect x="62" y="574" width="180" height="2" fill="url(#accent)"><animate attributeName="width" values="180;1156;180" dur="12s" repeatCount="indefinite"/></rect>
</svg>
